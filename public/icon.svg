<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b53e0"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#plate)"/>

  <!-- piggy bank: ear, body, legs, tail -->
  <g fill="#fff">
    <path d="M300 176 q34 -30 58 -18 q10 26 -12 54 z"/>
    <ellipse cx="252" cy="288" rx="126" ry="98"/>
    <rect x="168" y="360" width="46" height="56" rx="19"/>
    <rect x="292" y="360" width="46" height="56" rx="19"/>
    <path d="M128 250 q-40 -14 -44 18 q-2 26 26 26 q-16 -22 18 -26 z"/>
  </g>

  <!-- snout and eye -->
  <ellipse cx="366" cy="300" rx="30" ry="26" fill="#efeaff"/>
  <circle cx="360" cy="294" r="6.5" fill="#5b53e0"/>
  <circle cx="376" cy="304" r="6.5" fill="#5b53e0"/>
  <circle cx="300" cy="262" r="12" fill="#5b53e0"/>

  <!-- coin slot, and a coin going in -->
  <rect x="196" y="204" width="88" height="19" rx="9.5" fill="#5b53e0"/>
  <circle cx="240" cy="132" r="50" fill="#fbbf24"/>
  <circle cx="240" cy="132" r="33" fill="none" stroke="#b45309" stroke-width="10"/>
</svg>
